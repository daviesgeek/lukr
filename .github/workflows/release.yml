name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create repository release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate release tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const metadata = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          const tagMatch = /^v(\d+)\.(\d+)\.(\d+)$/.exec(tag);

          if (!tagMatch) {
            throw new Error(`Release tag ${tag} is not a stable semantic version (expected vX.Y.Z)`);
          }
          if (!metadata.name || !metadata.version) {
            throw new Error('package.json must define name and version before releasing');
          }
          if (metadata.version !== tag.slice(1)) {
            throw new Error(`Release tag ${tag} does not match package version ${metadata.version}`);
          }
          NODE

      - name: Build Docker image for verification
        run: docker build --tag "lukr:${GITHUB_REF_NAME#v}" .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
