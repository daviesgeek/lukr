name: CI

on:
  pull_request:

# PR jobs only need to inspect the repository. Keeping this read-only also
# protects forked pull requests from receiving write-capable credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Validate package contents
        run: pnpm pack --dry-run

      - name: Validate Docker image build
        run: docker build --file Dockerfile --tag lukr:ci .

      - name: Audit dependencies
        run: pnpm audit --audit-level high
